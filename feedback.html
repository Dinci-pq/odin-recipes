<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Feedback - Odin Recipes, a simple multi-page recipe website." />
    <title>Feedback | Odin Recipes</title>
  </head>
  <body>
  <a href="../index.html">Home</a>
    <main id="main-content">
      <h1>Feedback</h1>
      <p>Fields marked with an asterisk (*) are required.</p>

      <form action="https://formspree.io/f/YOUR_FORM_ID" method="post">
        <fieldset>
          <legend>About you</legend>

          <p>
            <label for="name">Name *</label><br />
            <input type="text" id="name" name="name" autocomplete="name" required />
          </p>

          <p>
            <label for="email">Email *</label><br />
            <input type="email" id="email" name="email" autocomplete="email" required />
          </p>
        </fieldset>

        <fieldset>
          <legend>About the recipe</legend>

          <p>
            <label for="recipe">Which recipe did you try? *</label><br />
            <select id="recipe" name="recipe" required>
            <option value="">Beef Sinigang</option>
            <option value="chicken-adobo">Chicken Adobo</option>
            <option value="pancakes">Menudo Rojo</option>
            </select>
          </p>

          <fieldset>
            <legend>Would you cook it again? *</legend>
            <p>
              <input type="radio" id="again-yes" name="again" value="yes" required />
              <label for="again-yes">Yes</label>
              <input type="radio" id="again-maybe" name="again" value="maybe" />
              <label for="again-maybe">Maybe</label>
              <input type="radio" id="again-no" name="again" value="no" />
              <label for="again-no">No</label>
            </p>
          </fieldset>

          <p>
            <label for="rating">Rating (1 to 5) *</label><br />
            <input type="number" id="rating" name="rating" min="1" max="5" required />
          </p>

          <p>
            <label for="comments">Comments</label><br />
            <textarea id="comments" name="comments" rows="5" cols="40"></textarea>
          </p>

          <p>
            <input type="checkbox" id="subscribe" name="subscribe" value="yes" />
            <label for="subscribe">Send me new recipes by email</label>
          </p>
        </fieldset>

        <p>
          <button type="submit">Send feedback</button>
          <button type="reset">Clear form</button>
        </p>
      </form>
    </main>

    <footer>
  </body>
</html>
